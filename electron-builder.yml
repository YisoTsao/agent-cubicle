# Packaging (SPEC §10 Phase 5). Signing/notarization are opt-in via environment variables so
# local and CI builds work unsigned:
#   macOS: CSC_LINK, CSC_KEY_PASSWORD (+ APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER and
#          `-c.mac.notarize=true`)
#   Windows: CSC_LINK / WIN_CSC_LINK, CSC_KEY_PASSWORD
appId: dev.agentcubicle.app
productName: AgentCubicle
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  notarize: false
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Development
