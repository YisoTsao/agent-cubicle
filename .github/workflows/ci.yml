name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Linux needs a virtual display for Electron.
      - name: E2E
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run --auto-servernum pnpm test:e2e; else pnpm test:e2e; fi

      - name: Package (unsigned) + packaged smoke test
        shell: bash
        run: |
          pnpm dist:dir
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run --auto-servernum pnpm test:packaged; else pnpm test:packaged; fi

      # Visual baselines are for human review (GPU output differs across runners), so they are
      # uploaded as artifacts rather than pixel-compared.
      - name: Visual captures
        if: runner.os == 'macOS'
        run: pnpm screenshots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: visual-captures
          path: tests/visual/baseline
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
